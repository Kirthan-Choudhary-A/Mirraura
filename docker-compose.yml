name: mirraura

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - BACKEND_PORT=8080
      - VERDICT_ENGINE_URL=http://verdict-engine:8000
    depends_on:
      - verdict-engine

  verdict-engine:
    build: ./verdict-engine
    ports:
      - "${VERDICT_ENGINE_PORT:-8000}:8000"
    volumes:
      - audit-log-data:/data

volumes:
  audit-log-data:
