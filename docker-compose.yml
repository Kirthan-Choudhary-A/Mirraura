name: mirraura

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - BACKEND_PORT=8080
      - VERDICT_ENGINE_URL=http://verdict-engine:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - verdict-engine

  verdict-engine:
    build: ./verdict-engine
    ports:
      - "${VERDICT_ENGINE_PORT:-8000}:8000"
    volumes:
      - audit-log-data:/data

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:${BACKEND_PORT:-8080}
    depends_on:
      - backend

volumes:
  audit-log-data:
