map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        # Docker Desktop's NAT means every external client shares one
        # apparent source IP here, so the login rate limiter is effectively
        # a single global bucket in that environment, not truly per-client.
        client_max_body_size 64m;
        proxy_read_timeout 3600s;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # $host (not $http_host) strips the port, so the backend saw
        # "localhost" while the browser's Origin header correctly included
        # ":5173" -- hub.go's CheckOrigin compares those directly and every
        # WebSocket upgrade failed origin validation as a result, confirmed
        # live via "websocket: rejecting origin ... (want host \"localhost\")"
        # in the backend's own logs.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
